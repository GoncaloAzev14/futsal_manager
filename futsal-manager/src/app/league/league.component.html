<div class="main-nav">
  <div class="nav-container">
    <button class="back-button" (click)="goBack()">
      <span class="back-icon">←</span>
      <span class="back-text">Voltar</span>
    </button>
    <div class="nav-title" *ngIf="competition">
      <span>{{ competition.icon }} {{ competition.name }}</span>
    </div>
  </div>
</div>

<router-outlet />

<div class="sub-nav">
  <div class="nav-container">
    <ul class="nav-links">
      <li>
        <a [routerLink]="['/competition', competitionId, 'standings']" routerLinkActive="active">
          <lucide-icon [img]="ChartColumn"></lucide-icon>
          <span>Classificação</span>
        </a>
      </li>

      <li>
        <a [routerLink]="['/competition', competitionId, 'matches']" routerLinkActive="active">
          <lucide-icon [img]="CircleDot"></lucide-icon>
          <span>Jogos</span>
        </a>
      </li>

      <li>
        <a [routerLink]="['/competition', competitionId, 'rounds']" routerLinkActive="active">
          <lucide-icon [img]="CalendarDays"></lucide-icon>
          <span>Jornadas</span>
        </a>
      </li>

      <li>
        <a [routerLink]="['/competition', competitionId, 'teams']" routerLinkActive="active">
          <lucide-icon [img]="Users"></lucide-icon>
          <span>Equipas</span>
        </a>
      </li>
    </ul>
  </div>
</div>
